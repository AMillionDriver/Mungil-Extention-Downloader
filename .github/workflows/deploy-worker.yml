name: Deploy mungil-si-validator Worker

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Compute Build SHA256 Signature
        id: sha
        run: |
          BUILD_SHA=$(git rev-parse --short=12 HEAD)
          echo "build_sha=$BUILD_SHA" >> $GITHUB_OUTPUT
          sed -i "s/BUILD_SHA_PLACEHOLDER/$BUILD_SHA/g" server/src/index.ts

      - name: Install dependencies & Typecheck
        run: |
          cd server
          npm ci
          npm run typecheck

      - name: Deploy to Cloudflare Workers
        run: |
          cd server
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is not set in GitHub Repository Secrets. Skipping remote deployment."
            exit 0
          fi
          npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
