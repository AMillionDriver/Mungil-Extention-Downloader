<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Sleek Linear/Raycast Header -->
    <header class="popup-header">
      <div class="header-branding">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2.5v7m0 0l-2.5-2.5m2.5 2.5l2.5-2.5" />
            <path d="M3 11.5v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1" />
          </svg>
        </div>
        <div class="header-title-group">
          <h1>TikTok Downloader</h1>
          <span class="version-badge">v1.0.0</span>
        </div>
      </div>
      <div class="header-status" title="Connection Status">
        <span class="status-dot" id="status-dot"></span>
      </div>
    </header>

    <!-- Main Content: Active Context Section -->
    <main class="popup-content">
      <section class="context-card" id="context-card">
        <!-- State 1: Active TikTok Video Detected -->
        <div class="state-container" id="state-tiktok" style="display: none;">
          <div class="video-meta">
            <div class="video-meta-header">
              <span class="meta-label">Active Video</span>
              <span class="status-chip" id="video-status-chip">Ready</span>
            </div>
            <div class="video-author-group">
              <span class="author-handle" id="video-author">@creator</span>
              <p class="video-desc" id="video-desc">Direct stream ready for download</p>
            </div>
          </div>

          <button class="btn btn-primary" id="btn-download-active">
            <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2.5v7m0 0l-2.5-2.5M8 9.5l2.5-2.5" />
              <path d="M3 12.5h10" />
            </svg>
            <span id="btn-download-text">Download Video</span>
          </button>
        </div>

        <!-- State 2: Non-TikTok / Idle Tab -->
        <div class="state-container" id="state-empty">
          <div class="empty-content">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="8" />
                <line x1="2" y1="10" x2="18" y2="10" />
                <path d="M10 2a13 13 0 0 1 4 8 13 13 0 0 1-4 8 13 13 0 0 1-4-8 13 13 0 0 1 4-8z" />
              </svg>
            </div>
            <h2 class="empty-title" id="platform-title">Not on TikTok</h2>
            <p class="empty-desc" id="platform-desc">Open TikTok Web to start downloading videos directly.</p>
          </div>
          <button class="btn btn-secondary" id="btn-open-tiktok">
            <span>Open TikTok Web</span>
            <svg class="btn-icon-sm" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11L11 3m0 0H5m6 0v6" />
            </svg>
          </button>
        </div>

        <!-- Dynamic Feedback Pill -->
        <div id="popup-status-msg" class="feedback-pill" style="display: none;"></div>
      </section>
    </main>

    <!-- Footer: Compact Utility Metrics & Actions -->
    <footer class="popup-footer">
      <div class="footer-metrics">
        <span class="metric-number" id="download-count">0</span>
        <span class="metric-label">downloads</span>
      </div>
      <button class="btn-icon-action" id="btn-open-downloads" title="Open Downloads Folder" aria-label="Open Downloads Folder">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.5 3.5a1 1 0 0 1 1-1h3.5l1.5 2h6.5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-12.5a1 1 0 0 1-1-1v-9z" />
        </svg>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
